[project]
name = "galagino-romconv"
version = "0.1.0"
description = "ROM conversion tools for galagino"
requires-python = ">=3.13"
dependencies = [
  "numpy==2.5.3",
  "pillow==12.3.0",
  "patch-ng==1.19.1",
]

[dependency-groups]
dev = ["pytest==8.3.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["slow: runs real conversions"]
