; Environments are <board>-<mode>:
;   board:   [board_*] sections, hardware (MCU board, TFT, pins, controller)
;   mode:    [mode_*] sections, which games are built in
; Board mounted USB connector up: BOARD_USBUP in config_local.h.
; Game lists in [games] are disjoint, each game appears once.
; ESP-IDF (no Arduino core); sdkconfig.defaults holds the IDF configuration.

[platformio]
default_envs = fnk0103f-local

; Arena blocks per layout: A B bytes, plain integers (romconv reads this
; section with configparser: no ${} references). Names are C identifiers;
; a name ending in _remote gets asset bundles. Every env selects one with
; custom_arena_layout; extraScript.py turns it into ARENA_LAYOUT_<NAME>,
; ARENA_A_SIZE, ARENA_B_SIZE and appends sdkconfig.defaults.<name> to
; SDKCONFIG_DEFAULTS when it exists (the task stacks that make the row
; fit). ESP32: two internal RAM regions, one malloc
; cannot span them. ASSETS_REMOTE links WiFi (~23 KB static DRAM out of the
; boot heap), so its block A is smaller.
; esp32_local: bar from the HEAP_PROBE end dump over all games of
; azdelivery-local and -max: A's region (SRAM2) min_free >= 9328 (LZMA
; scratch 5232 + one 4 KB heap step); sdkconfig.defaults.esp32_local cuts
; the task stacks for it. The heap hands out blocks this large in 4 KB
; steps, keep A a multiple of 4096.
; B 110500: the second region (D/IRAM 0x3ffe4350, 113840 B) minus IDF use.
; esp32s3_local: fnk0104 placeholder until measured. rp2350: one pool
; (B = 0) once measured.
[arena]
esp32_local = 126976 110500
esp32_remote = 69000 110500
esp32s3_local = 118784 110500
rp2350 = 118784 110500

[env]
platform = espressif32 @ 7.1.0
framework = espidf
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; RTS (EN) inactive while monitoring: closing the port otherwise drops DTR and
; RTS at once, a short EN pulse that can hang the ESP32 until power cycle
monitor_rts = 0
extra_scripts = pre:extraScript.py
custom_prog_name = GALAGINOMAX
custom_prog_version = v1.0.0
board_build.partitions = partitions.csv
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
build_unflags =
    -fno-lto
    ; IDF's C-only option, which the PlatformIO espidf builder also passes to C++
    -Wno-old-style-declaration
build_flags =
    -D HAL_ESP
    -D BUILD_ENV_NAME=$PIOENV
    -D BOOT_SELFTEST
;    -D DEBUG_TIMING
;    -D BUBLBOBL_SCALE
    -D BUBLBOBL_CROP
;    -D BUBLBOBL_SCALE_BORDER
;    -D STARWARS_INVERT_Y
; Solomon's Key: default crops 8 px per side, SOLOMON_SCALE drops every 16th column,
; SOLOMON_SCROLL moves the 240 px window with the player
;    -D SOLOMON_SCALE
    -D SOLOMON_SCROLL
; attract mode, defaults in config.h (config_local.h may override)
;    -D MASTER_ATTRACT_MENU_TIMEOUT=20000    ; ms idle in menu, then attract starts a game
;    -D MASTER_ATTRACT_GAME_TIMEOUT=300000   ; ms an attract game runs, then the next one
;    -D MASTER_ATTRACT_MENU_COUNTDOWN_BAR_COLOR565=0x1234  ; menu countdown bar, byte-swapped RGB565
;    -D NO_DOWNLOADS_IN_ATTRACT=0            ; remote build: menu attract downloads games too
    -D SILENT_ATTRACT_MODE                  ; demo sounds off
    -fomit-frame-pointer
    ; IDF compiles with -Werror=all: the emulator cores are not warning-free
    -w
build_src_flags =
    -Wunknown-pragmas

