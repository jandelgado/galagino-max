; Environments are <board>-<mode>:
;   board:   [board_*] sections, hardware (MCU board, TFT, pins, controller)
;   mode:    [mode_*] sections, which games are built in
; Board mounted USB connector up: BOARD_USBUP in config_local.h.
; Game sets, modes, shared options and Arena layouts: firmware.toml (read by
; extraScript.py, which appends their defines). A mode section here names its
; firmware.toml mode (custom_mode) and adds the ESP32-only flags.
; ESP-IDF (no Arduino core); sdkconfig.defaults holds the IDF configuration.

[platformio]
default_envs = fnk0103f-local

; Every env selects an Arena layout of firmware.toml [arena] with
; custom_arena_layout; extraScript.py also appends sdkconfig.defaults.<name>
; to SDKCONFIG_DEFAULTS when it exists (the task stacks that make the row fit).

[env]
platform = espressif32 @ 7.1.0
framework = espidf
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; RTS (EN) inactive while monitoring: closing the port otherwise drops DTR and
; RTS at once, a short EN pulse that can hang the ESP32 until power cycle
monitor_rts = 0
extra_scripts = pre:extraScript.py
custom_prog_name = GALAGINOMAX
custom_prog_version = v1.0.0
board_build.partitions = partitions.csv
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
build_unflags =
    -fno-lto
    ; IDF's C-only option, which the PlatformIO espidf builder also passes to C++
    -Wno-old-style-declaration
build_flags =
    -D HAL_ESP
    -D BUILD_ENV_NAME=$PIOENV
    -fomit-frame-pointer
    ; IDF compiles with -Werror=all: the emulator cores are not warning-free
    -w
build_src_flags =
    -Wunknown-pragmas

; ---------------------------------------------------------------- modes

; 4 MB flash, games built in
[mode_local]
custom_mode = local

; 4 MB flash, most games: per-game IRAM code in flash (IRAM full)
[mode_max]
custom_mode = max
build_flags = -D GAME_NO_IRAM

; 16 MB flash, every game built in
[mode_full]
custom_mode = full

; built-in games + every other catalog game downloaded over WiFi into the
; 1 MB assets partition
[mode_remote]
custom_mode = remote
board_build.partitions = partitions-assets.csv
build_flags =
    ; WiFi takes IRAM: game functions and the 6502 core stay in flash
    -D GAME_NO_IRAM
    -D M6502_NO_IRAM
    -Wl,--wrap=free

; ---------------------------------------------------------------- boards

; pins and settings: src/boards/<board>.h, selected by BOARD_<NAME>

; pins from config_local.h
[board_azdelivery]
board = az-delivery-devkit-v4
monitor_raw = yes
monitor_filters =
build_flags =
    -D TFT_SPICLK=40000000

[board_cyd]
board = esp32dev
monitor_filters = time, esp32_exception_decoder

; ILI9341 - SPI clock 40MHz
[board_cyd2432s028r]
extends = board_cyd
build_flags =
    -D BOARD_CYD2432S028R

;https://github.com/Freenove/Freenove_ESP32_Display
;https://docs.freenove.com/projects/fnk0103/en/latest/fnk0103/codes/tutorial/Freenove_ESP32_Display.html
; ILI9341 - SPI clock 40MHz, transparent
[board_fnk0103f]
extends = board_cyd
build_flags =
    -D BOARD_FNK0103F

; ST7789 - SPI clock 80MHz, black
[board_fnk0103b]
extends = board_cyd
build_flags =
    -D BOARD_FNK0103B

; ESP32-S3 display, ILI9341 - SPI clock 40MHz, silk white
[board_fnk0104]
board = fnk0104
monitor_filters = time, esp32_exception_decoder
upload_speed = 2000000
board_build.boot = qio
board_build.partitions = partitions-s3-16M.csv
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.16mb"
build_flags =
    -D BOARD_FNK0104

; ---------------------------------------------------------------- envs

[env:azdelivery-local]
extends = board_azdelivery, mode_local
build_flags = ${env.build_flags} ${board_azdelivery.build_flags}
custom_arena_layout = esp32_local

[env:azdelivery-remote]
extends = board_azdelivery, mode_remote
build_flags = ${env.build_flags} ${board_azdelivery.build_flags} ${mode_remote.build_flags}
custom_arena_layout = esp32_remote

[env:azdelivery-max]
extends = board_azdelivery, mode_max
build_flags = ${env.build_flags} ${board_azdelivery.build_flags} ${mode_max.build_flags}
custom_arena_layout = esp32_local

[env:cyd2432s028r-local]
extends = board_cyd2432s028r, mode_local
build_flags = ${env.build_flags} ${board_cyd2432s028r.build_flags}
custom_arena_layout = esp32_local

[env:cyd2432s028r-remote]
extends = board_cyd2432s028r, mode_remote
build_flags = ${env.build_flags} ${board_cyd2432s028r.build_flags} ${mode_remote.build_flags}
custom_arena_layout = esp32_remote

; hand-wired CYD (ESP32-2432W328C, ST7789): boards/cyd_manual.h, pins and
; NUNCHUCK_INPUT from config_local.h or build flags
[env:cydmanual-local]
extends = mode_local
board = esp32-2432W328C
build_flags = ${env.build_flags} -D CHEAP_YELLOW_DISPLAY_CONF -D TFT_SPICLK=80000000
custom_arena_layout = esp32_local

[env:fnk0103f-local]
extends = board_fnk0103f, mode_local
build_flags = ${env.build_flags} ${board_fnk0103f.build_flags}
custom_arena_layout = esp32_local

[env:fnk0103f-remote]
extends = board_fnk0103f, mode_remote
build_flags = ${env.build_flags} ${board_fnk0103f.build_flags} ${mode_remote.build_flags}
custom_arena_layout = esp32_remote

[env:fnk0103b-local]
extends = board_fnk0103b, mode_local
build_flags = ${env.build_flags} ${board_fnk0103b.build_flags}
custom_arena_layout = esp32_local

[env:fnk0103b-remote]
extends = board_fnk0103b, mode_remote
build_flags = ${env.build_flags} ${board_fnk0103b.build_flags} ${mode_remote.build_flags}
custom_arena_layout = esp32_remote

[env:fnk0104-full]
extends = board_fnk0104, mode_full
build_flags = ${env.build_flags} ${board_fnk0104.build_flags}
custom_arena_layout = esp32s3_local

; host unit tests: devbox run -- bash -c "cd source && pio test -e native"
[env:native]
platform = native
framework =
extra_scripts = pre:extraScript.py
monitor_filters =
build_unflags =
build_flags = -std=gnu++11 -pthread -D HAL_HOST
custom_arena_layout = esp32_local
build_src_flags =
lib_deps =
test_build_src = no
