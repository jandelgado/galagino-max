; Environments are <board>-<mode>, each a row of [envs] in firmware.toml
; (board profile, mode, Arena layout); extraScript.py appends its defines.
; This file only adds what PlatformIO needs per env:
;   board:   [board_*] sections, PlatformIO board and upload settings
;   mode:    [mode_*] sections, partitions and linker flags
; Board mounted USB connector up: BOARD_USBUP in config_local.h.
; Dev builds: GAMES=a,b replaces the env's games, DEFINES="A=1 B" adds defines.
; ESP-IDF (no Arduino core); sdkconfig.defaults holds the IDF configuration.

[platformio]
default_envs = fnk0103f-local

; extraScript.py appends sdkconfig.defaults.<layout> of the env's Arena layout
; to SDKCONFIG_DEFAULTS when it exists (the task stacks that make the row fit).

[env]
platform = espressif32 @ 7.1.0
framework = espidf
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; RTS (EN) inactive while monitoring: closing the port otherwise drops DTR and
; RTS at once, a short EN pulse that can hang the ESP32 until power cycle
monitor_rts = 0
extra_scripts = pre:extraScript.py
custom_prog_name = GALAGINOMAX
custom_prog_version = v1.0.0
board_build.partitions = partitions.csv
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
build_unflags =
    -fno-lto
    ; IDF's C-only option, which the PlatformIO espidf builder also passes to C++
    -Wno-old-style-declaration
build_flags =
    -D BUILD_ENV_NAME=$PIOENV
    -fomit-frame-pointer
    ; IDF compiles with -Werror=all: the emulator cores are not warning-free
    -w
build_src_flags =
    -Wunknown-pragmas

; ---------------------------------------------------------------- modes

; downloaded games go to the 1 MB assets partition
[mode_remote]
board_build.partitions = partitions-assets.csv
build_flags =
    -Wl,--wrap=free

; ---------------------------------------------------------------- boards

; pins and settings: src/boards/<board>.h (firmware.toml [envs] board)

; pins from config_local.h
[board_azdelivery]
board = az-delivery-devkit-v4
monitor_raw = yes
monitor_filters =

[board_cyd]
board = esp32dev
monitor_filters = time, esp32_exception_decoder

; ILI9341 - SPI clock 40MHz
[board_cyd2432s028r]
extends = board_cyd

;https://github.com/Freenove/Freenove_ESP32_Display
;https://docs.freenove.com/projects/fnk0103/en/latest/fnk0103/codes/tutorial/Freenove_ESP32_Display.html
; ILI9341 - SPI clock 40MHz, transparent
[board_fnk0103f]
extends = board_cyd

; ST7789 - SPI clock 80MHz, black
[board_fnk0103b]
extends = board_cyd

; ESP32-S3 display, ILI9341 - SPI clock 40MHz, silk white
[board_fnk0104]
board = fnk0104
monitor_filters = time, esp32_exception_decoder
upload_speed = 2000000
board_build.boot = qio
board_build.partitions = partitions-s3-16M.csv
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.16mb"

; ---------------------------------------------------------------- envs

[env:azdelivery-local]
extends = board_azdelivery

[env:azdelivery-remote]
extends = board_azdelivery, mode_remote
build_flags = ${env.build_flags} ${mode_remote.build_flags}

[env:azdelivery-max]
extends = board_azdelivery

[env:cyd2432s028r-local]
extends = board_cyd2432s028r

[env:cyd2432s028r-remote]
extends = board_cyd2432s028r, mode_remote
build_flags = ${env.build_flags} ${mode_remote.build_flags}

; hand-wired CYD (ESP32-2432W328C, ST7789): boards/cyd_manual.h, pins and
; NUNCHUCK_INPUT from config_local.h or build flags
[env:cydmanual-local]
board = esp32-2432W328C

[env:fnk0103f-local]
extends = board_fnk0103f

[env:fnk0103f-remote]
extends = board_fnk0103f, mode_remote
build_flags = ${env.build_flags} ${mode_remote.build_flags}

[env:fnk0103b-local]
extends = board_fnk0103b

[env:fnk0103b-remote]
extends = board_fnk0103b, mode_remote
build_flags = ${env.build_flags} ${mode_remote.build_flags}

[env:fnk0104-full]
extends = board_fnk0104

; host unit tests: devbox run -- bash -c "cd source && pio test -e native"
[env:native]
platform = native
framework =
extra_scripts = pre:extraScript.py
monitor_filters =
build_unflags =
build_flags = -std=gnu++11 -pthread
build_src_flags =
lib_deps =
test_build_src = no
