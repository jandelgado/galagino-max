; ---------------------------------------------------------------- modes

; 4 MB flash, games built in
[mode_local]
build_flags = ${games.builtin} ${games.local}

; 16 MB flash, every game built in
[mode_full]
build_flags = ${games.builtin} ${games.local} ${games.rest}

; built-in games + every other catalog game downloaded over WiFi into the
; 1 MB assets partition. GALAGINO_WIFI_SSID/PASS and GALAGINO_ASSETS_URL
; from config_local.h.
[mode_remote]
board_build.arduino.partitions = partitions-assets.csv
build_flags =
    ${games.builtin}
    -D ASSETS_REMOTE
    -D M6502_NO_IRAM
    -D M6809_NO_IRAM
    -Wl,--wrap=free

; ---------------------------------------------------------------- boards

; pins from config_local.h
[board_azdelivery]
board = az-delivery-devkit-v4
monitor_raw = yes
build_flags =
    -D TFT_SPICLK=40000000

[board_cyd]
board = esp32dev
monitor_filters = time, esp32_exception_decoder
build_flags =
    -D USE_PIO_CONFIG
    -D TFT_DC=2
    -D TFT_CS=15
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_BL=21
    -D TFT_BL_LEVEL=HIGH
    -D TFT_RST=-1
    -D GALAGINO_CONTROLLER
    -D GALAGINO_CONTROLLER_ADDR=0x09
    -D BTN_START_PIN=35
    -D BTN_LEFT_PIN=35
    -D BTN_RIGHT_PIN=35
    -D BTN_DOWN_PIN=35
    -D BTN_UP_PIN=35
    -D BTN_FIRE_PIN=35

; ILI9341 - SPI clock 40MHz
[board_cyd2432s028r]
extends = board_cyd
build_flags =
    ${board_cyd.build_flags}
    -D TFT_ILI9341
    -D TFT_SPICLK=40000000L
    -D GALAGINO_CONTROLLER_SDA=27
    -D GALAGINO_CONTROLLER_SCL=22

;https://github.com/Freenove/Freenove_ESP32_Display
;https://docs.freenove.com/projects/fnk0103/en/latest/fnk0103/codes/tutorial/Freenove_ESP32_Display.html
; ILI9341 - SPI clock 40MHz, transparent
[board_fnk0103f]
extends = board_cyd
build_flags =
    ${board_cyd.build_flags}
    -D AUDIO_ENABLE_PIN=4
    -D TFT_ILI9341
    -D TFT_SPI_HOST=SPI2_HOST
    -D TFT_SPICLK=40000000L
    -D GALAGINO_CONTROLLER_SDA=18
    -D GALAGINO_CONTROLLER_SCL=19
    -D MENU_CYLINDER

; ST7789 - SPI clock 80MHz, black
[board_fnk0103b]
extends = board_cyd
build_flags =
    ${board_cyd.build_flags}
    -D AUDIO_ENABLE_PIN=4
    -D TFT_ST7789
    -D TFT_SPI_HOST=SPI2_HOST
    -D TFT_SPICLK=80000000L
    -D GALAGINO_CONTROLLER_SDA=18
    -D GALAGINO_CONTROLLER_SCL=19
    -D TFT_VFLIP

; ESP32-S3 display, ILI9341 - SPI clock 40MHz, silk white
[board_fnk0104]
board = fnk0104
monitor_filters = time, esp32_exception_decoder
upload_speed = 2000000
board_build.boot = qio
board_build.arduino.memory_type = qio_opi
board_build.arduino.partitions = partitions-s3-16M.csv
build_flags =
    -D USE_PIO_CONFIG
    -D AUDIO_ENABLE_PIN=1
    -D TFT_ILI9341
    -D TFT_INVERT
    -D TFT_SPICLK=40000000L
    -D TFT_CS=10
    -D TFT_DC=46
    -D TFT_MISO=13
    -D TFT_MOSI=11
    -D TFT_SCLK=12
    -D TFT_SPI_HOST=SPI2_HOST
    -D TFT_BL=45
    -D TFT_BL_LEVEL=HIGH
    -D TFT_RST=-1
    -D GALAGINO_CONTROLLER
    -D GALAGINO_CONTROLLER_ADDR=0x09
    -D GALAGINO_CONTROLLER_SDA=16
    -D GALAGINO_CONTROLLER_SCL=15
    -D ES8311_AUDIO
    -D ES8311_I2C_CLK=400000
    -D ES8311_I2C_ADDR=0x18
    -D ES8311_I2C_SDA=16
    -D ES8311_I2C_SCL=15
    -D ES8311_I2S_MCK=4
    -D ES8311_I2S_BCK=5
    -D ES8311_I2S_DIN=6
    -D ES8311_I2S_DOUT=8
    -D ES8311_I2S_WS=7
    -D BTN_START_PIN=35
    -D BTN_LEFT_PIN=35
    -D BTN_RIGHT_PIN=35
    -D BTN_DOWN_PIN=35
    -D BTN_UP_PIN=35
    -D BTN_FIRE_PIN=35

; ---------------------------------------------------------------- envs

[env:azdelivery-local]
extends = board_azdelivery, mode_local
build_flags = ${env.build_flags} ${board_azdelivery.build_flags} ${mode_local.build_flags}

[env:azdelivery-remote]
extends = board_azdelivery, mode_remote
build_flags = ${env.build_flags} ${board_azdelivery.build_flags} ${mode_remote.build_flags}

[env:cyd2432s028r-local]
extends = board_cyd2432s028r, mode_local
build_flags = ${env.build_flags} ${board_cyd2432s028r.build_flags} ${mode_local.build_flags}

[env:cyd2432s028r-remote]
extends = board_cyd2432s028r, mode_remote
build_flags = ${env.build_flags} ${board_cyd2432s028r.build_flags} ${mode_remote.build_flags}

[env:fnk0103f-local]
extends = board_fnk0103f, mode_local
build_flags = ${env.build_flags} ${board_fnk0103f.build_flags} ${mode_local.build_flags}

[env:fnk0103f-remote]
extends = board_fnk0103f, mode_remote
build_flags = ${env.build_flags} ${board_fnk0103f.build_flags} ${mode_remote.build_flags}

[env:fnk0103b-local]
extends = board_fnk0103b, mode_local
build_flags = ${env.build_flags} ${board_fnk0103b.build_flags} ${mode_local.build_flags}

[env:fnk0103b-remote]
extends = board_fnk0103b, mode_remote
build_flags = ${env.build_flags} ${board_fnk0103b.build_flags} ${mode_remote.build_flags}

[env:fnk0104-full]
extends = board_fnk0104, mode_full
build_flags = ${env.build_flags} ${board_fnk0104.build_flags} ${mode_full.build_flags}

; usbup: board mounted USB connector up, TFT flipped
[env:cyd2432s028r-local-usbup]
extends = env:cyd2432s028r-local
build_flags = ${env:cyd2432s028r-local.build_flags} -D TFT_VFLIP

[env:cyd2432s028r-remote-usbup]
extends = env:cyd2432s028r-remote
build_flags = ${env:cyd2432s028r-remote.build_flags} -D TFT_VFLIP

[env:fnk0103f-local-usbup]
extends = env:fnk0103f-local
build_flags = ${env:fnk0103f-local.build_flags} -D TFT_VFLIP

[env:fnk0103f-remote-usbup]
extends = env:fnk0103f-remote
build_flags = ${env:fnk0103f-remote.build_flags} -D TFT_VFLIP

[env:fnk0103b-local-usbup]
extends = env:fnk0103b-local
build_unflags = ${env.build_unflags} -D TFT_VFLIP

[env:fnk0103b-remote-usbup]
extends = env:fnk0103b-remote
build_unflags = ${env.build_unflags} -D TFT_VFLIP

[env:fnk0104-full-usbup]
extends = env:fnk0104-full
build_flags = ${env:fnk0104-full.build_flags} -D TFT_VFLIP

; host unit tests: devbox run -- bash -c "cd source && pio test -e native"
[env:native]
platform = native
framework =
extra_scripts =
monitor_filters =
build_unflags =
build_flags = -std=gnu++11 -pthread
build_src_flags =
lib_deps =
; es8311 (ESP32 codec driver) needs Arduino; LDF pulls it in for audio.cpp
lib_ignore = es8311
test_build_src = no
