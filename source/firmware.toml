# Modes: game sets built in, plus mode defines. Partitions live with the
# platform.
[modes]
# 4 MB flash, games built in
local = { games = ["builtin", "local"] }
# 4 MB flash, most games
max = { games = ["max"] }
# 16 MB flash, every game built in
full = { games = ["builtin", "local", "rest"] }
# built-in games + every other catalog game downloaded over WiFi.
# GALAGINO_WIFI_SSID/PASS and GALAGINO_ASSETS_URL from config_local.h.
remote = { games = ["builtin"], defines = ["ASSETS_REMOTE"] }
